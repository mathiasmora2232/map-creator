<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Map Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/sitio/css/sitio.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e2690b'/%3E%3Cpath d='M8 9h9v6h7v8H8z' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
</head>
<body>
<div class="pag-cuenta">
  <div class="lado-form">
    <a class="logo" href="/" data-logo>Map Creator</a>
    <div class="form-caja">
      <h1>Hola de nuevo</h1>
      <p class="sub">Entra para seguir con tus mapas.</p>
      <form id="formCuenta" data-modo="entrar" novalidate>
        <label class="campo"><span>Correo</span><input type="email" name="email" autocomplete="email" required autofocus></label>
        <label class="campo"><span>Contraseña</span><input type="password" name="clave" autocomplete="current-password" required></label>
        <p class="error-form" id="errorForm" role="alert"></p>
        <button class="btn prim grande" type="submit">Entrar</button>
      </form>
      <p class="alt" data-registro-alt>¿No tienes cuenta? <a href="/registro">Crea una gratis</a></p>
    </div>
  </div>
  <div class="lado-arte" aria-hidden="true">
    <div id="arte"></div>
    <blockquote>Mientras dibujas una pared, escribe <b>4,5</b> y pulsa Enter: el tramo sale con la medida exacta hacia donde apunta el ratón.<small>CONSEJO · PLANO 2D</small></blockquote>
  </div>
</div>
<script src="/sitio/js/comun.js"></script>
<script src="/sitio/js/cuenta.js"></script>
</body>
</html>
